<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64" fill="none">
  <defs>
    <linearGradient id="line-grad-CH.02" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="1" />
      <stop offset="35%" stop-color="#58A6FF" stop-opacity="0.7" />
      <stop offset="75%" stop-color="#30363D" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#21262D" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="badge-grad-CH.02" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow-CH.02" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00F5D4" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background bar -->
  <rect width="900" height="64" fill="#0D1117" />

  <!-- Chapter Chip Badge -->
  <rect x="8" y="10" width="82" height="28" rx="6" fill="url(#badge-grad-CH.02)" stroke="#00F5D4" stroke-width="1.2" filter="url(#glow-CH.02)" />
  <text x="49" y="29" fill="#00F5D4" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">CH.02</text>

  <!-- Futuristic Divider -->
  <text x="104" y="29" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="600" opacity="0.6">//</text>

  <!-- Main Section Title -->
  <text x="128" y="30" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, 'Helvetica Neue', sans-serif" font-size="17" font-weight="800" letter-spacing="2.2">SPECIMENS</text>

  <!-- Right Telemetry Readout -->
  <text x="890" y="29" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="500" letter-spacing="1.2" text-anchor="end">● LAB BENCH // ARCHIVE</text>

  <!-- High-Tech Bottom Accent Line -->
  <rect x="8" y="50" width="884" height="2" fill="url(#line-grad-CH.02)" />
  <rect x="8" y="48" width="12" height="6" fill="#00F5D4" rx="1.5" />
</svg>