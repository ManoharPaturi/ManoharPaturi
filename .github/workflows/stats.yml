name: Refresh stats cards

on:
  schedule:
    - cron: "0 3 * * *" # daily 03:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: generate cards
        run: python scripts/gen_stats.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/languages.svg
          git diff --cached --quiet || (git commit -m "chore: refresh stats cards [skip ci]" && git push)
