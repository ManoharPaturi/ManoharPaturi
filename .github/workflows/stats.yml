name: Refresh stats cards

on:
  schedule:
    - cron: "17 3 * * *" # off-peak daily refresh
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'ManoharPaturi/ManoharPaturi'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: generate cards
        run: python scripts/gen_stats.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/
          git diff --cached --quiet || (git commit -m "chore: refresh telemetry [skip ci]" && git pull --rebase && git push)
